services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: leafygo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  targets-db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${SEED_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${SEED_SUPERUSER_PASSWORD:-postgres}
    ports:
      - "5434:5432"
    volumes:
      - targetsdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 3s
      retries: 10

  analytics-db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${SEED_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${SEED_SUPERUSER_PASSWORD:-postgres}
    ports:
      - "5436:5432"
    volumes:
      - analyticsdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 3s
      retries: 10

  seed:
    build: .
    entrypoint: ["/seed"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      targets-db:
        condition: service_healthy
      analytics-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/leafygo?sslmode=disable
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      APP_ENV: ${APP_ENV:-development}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-password123}
      SEED_TARGETS_HOST: targets-db
      SEED_TARGETS_PORT: "5432"
      SEED_ANALYTICS_HOST: analytics-db
      SEED_ANALYTICS_PORT: "5432"
      SEED_SUPERUSER: ${SEED_SUPERUSER:-postgres}
      SEED_SUPERUSER_PASSWORD: ${SEED_SUPERUSER_PASSWORD:-postgres}
      SEED_APP_DB_USER: ${SEED_APP_DB_USER:-leafygo_app}
      SEED_APP_DB_PASSWORD: ${SEED_APP_DB_PASSWORD:-leafygo_app}

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/leafygo?sslmode=disable
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      ADDR: ":8080"
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      UI_PREVIEW: ${UI_PREVIEW:-}
      TARGET_CONNECT_TIMEOUT: ${TARGET_CONNECT_TIMEOUT:-}
      VIEWER_STATEMENT_TIMEOUT: ${VIEWER_STATEMENT_TIMEOUT:-}
      VIEWER_PAGE_SIZE: ${VIEWER_PAGE_SIZE:-}
      VIEWER_MAX_PAGE_SIZE: ${VIEWER_MAX_PAGE_SIZE:-}
      MIGRATION_ADVISORY_LOCK_TIMEOUT: ${MIGRATION_ADVISORY_LOCK_TIMEOUT:-}
      MIGRATION_TIMEOUT: ${MIGRATION_TIMEOUT:-}
      MAX_MIGRATION_BYTES: ${MAX_MIGRATION_BYTES:-}
      SESSION_IDLE_TIMEOUT: ${SESSION_IDLE_TIMEOUT:-}
      SESSION_ABSOLUTE_TIMEOUT: ${SESSION_ABSOLUTE_TIMEOUT:-}
      SESSION_ROTATE_INTERVAL: ${SESSION_ROTATE_INTERVAL:-}
      SESSION_GRACE_PERIOD: ${SESSION_GRACE_PERIOD:-}
      APP_ENV: ${APP_ENV:-development}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}

volumes:
  pgdata:
  targetsdata:
  analyticsdata:
