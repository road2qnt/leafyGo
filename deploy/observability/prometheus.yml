global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: leafygo-server
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8080"]
        labels:
          service: leafygo-api
          pool_role: server

  # The worker must expose /metrics on :8081 (M2 worker milestone).
  - job_name: leafygo-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:8081"]
        labels:
          service: leafygo-worker
          pool_role: worker

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
