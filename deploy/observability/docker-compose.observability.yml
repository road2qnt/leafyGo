# LeafyGo M2 observability stack (pinned images).
#
# Prerequisite: the application stack (`docker compose up -d` at the repo root)
# must be running, because Prometheus scrapes `app:8080` / `worker:8081` over the
# shared `leafygo_default` network.
#
#   docker compose -f deploy/observability/docker-compose.observability.yml up -d
#
# Grafana: http://localhost:3000 (anonymous admin, local demo only)

name: leafygo-observability

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    # Root is only needed to read Docker's root-owned JSON log files. This stack
    # is a local/demo stack; do not reuse this setting in production.
    user: "0:0"
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro,z
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # collector Prometheus exporter
      - "13133:13133" # health_check
    networks: [leafygo]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol/config.yaml"]
      interval: 30s
      timeout: 5s
      retries: 3

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro,z
      - tempo-data:/var/tempo
    networks: [leafygo]
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml:ro,z
      - loki-data:/loki
    networks: [leafygo]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks: [leafygo]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: traceQLStreaming
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/leafygo-observability.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro,z
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks: [leafygo]
    depends_on:
      - prometheus
      - tempo
      - loki
    restart: unless-stopped

networks:
  leafygo:
    name: ${LEAFYGO_NETWORK:-leafygo_default}
    external: true

volumes:
  tempo-data:
  loki-data:
  prometheus-data:
  grafana-data:
